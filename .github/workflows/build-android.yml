name: Build EnglishAPK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm install

      - name: Validate grammar corpus
        run: npm run test:grammar

      - name: Build EnglishAPK
        run: npm run build:android

      - name: Verify native APK filename
        run: test -f platforms/android/app/build/outputs/apk/debug/EnglishAPK.apk

      - name: Verify final APK filename
        run: test -f dist/EnglishAPK.apk

      - name: Upload EnglishAPK
        uses: actions/upload-artifact@v4
        with:
          name: EnglishAPK
          path: dist/EnglishAPK.apk
          if-no-files-found: error
