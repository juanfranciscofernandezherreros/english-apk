name: Build EnglishAPK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm install

      - name: Build EnglishAPK
        run: npm run build:android

      - name: Verify native APK filename
        run: test -f platforms/android/app/build/outputs/apk/debug/EnglishAPK.apk

      - name: Verify final APK filename
        run: test -f dist/EnglishAPK.apk

      - name: Upload EnglishAPK
        uses: actions/upload-artifact@v4
        with:
          name: EnglishAPK
          path: dist/EnglishAPK.apk
          if-no-files-found: error

      - name: Publish downloadable APK in GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view apk-latest >/dev/null 2>&1; then
            gh release upload apk-latest dist/EnglishAPK.apk --clobber
          else
            gh release create apk-latest dist/EnglishAPK.apk --title "Easy English APK para Android" --notes "Descarga de la app Easy English para Android (versión de prueba/debug)." --latest
          fi
