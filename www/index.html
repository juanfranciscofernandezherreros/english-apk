<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' data: gap: https://ssl.gstatic.com 'unsafe-eval'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; img-src 'self' data: content:;">
  <meta name="viewport" content="initial-scale=1,width=device-width,viewport-fit=cover">
  <title>Easy English · Questions</title>
  <style>
    :root{--bg:#f7f5ef;--card:#fff;--ink:#1f2933;--muted:#667085;--green:#235347;--soft:#dbece6;--gold:#f4b860;--line:#e7e4dc;--red:#c86157}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    button{font:inherit;cursor:pointer}
    .app{max-width:560px;margin:auto;padding:env(safe-area-inset-top) 16px calc(34px + env(safe-area-inset-bottom))}
    .topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 0 18px}
    .brand{display:flex;align-items:center;gap:10px;font-weight:900}.mark{width:38px;height:38px;border-radius:12px;background:var(--green);color:#fff;display:grid;place-items:center;font-size:13px}
    .score{padding:8px 11px;border-radius:999px;background:var(--soft);color:var(--green);font-size:12px;font-weight:900}
    .progress{height:8px;background:#e7e4dc;border-radius:999px;overflow:hidden}.progress>span{display:block;height:100%;background:var(--green);width:0%;transition:.25s}
    .question-card{margin-top:18px;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:24px 20px;box-shadow:0 16px 42px rgba(31,41,51,.07)}
    .meta{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--green);font-weight:900}
    h1{font:700 30px/1.08 Georgia,"Times New Roman",serif;letter-spacing:-.035em;margin:14px 0 8px}
    .prompt{font-size:16px;color:var(--muted);margin:0 0 18px}
    .sentence{padding:18px;border-radius:18px;background:#efe9da;font-size:20px;font-weight:850;line-height:1.42;margin-bottom:18px}
    .answers{display:grid;gap:10px}
    .answer{width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:14px;padding:15px 16px;color:var(--ink);font-weight:750;line-height:1.35}
    .answer:hover{border-color:var(--green)}
    .answer.correct{background:var(--soft);border-color:var(--green);color:var(--green)}
    .answer.wrong{background:#fde8e6;border-color:var(--red);color:#8c3f37}
    .answer:disabled{cursor:default}
    .feedback{min-height:26px;margin:16px 0 0;font-weight:850}
    .next{width:100%;border:0;background:var(--green);color:#fff;border-radius:14px;padding:15px;margin-top:12px;font-weight:900;display:none}
    .next.show{display:block}
    .footer{text-align:center;color:var(--muted);font-size:12px;margin-top:18px}
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand"><span class="mark">EN</span><span>Easy English</span></div>
      <span class="score" id="score">0 correct</span>
    </header>

    <div class="progress"><span id="progressBar"></span></div>

    <main class="question-card">
      <div class="meta" id="meta">A1 · Present Simple</div>
      <h1>Choose the correct answer</h1>
      <p class="prompt">What is the Spanish translation?</p>
      <div class="sentence" id="sentence"></div>
      <div class="answers" id="answers"></div>
      <div class="feedback" id="feedback"></div>
      <button class="next" id="nextBtn">Next question →</button>
    </main>

    <div class="footer">10,000 questions · A1 to C1 · Offline</div>
  </div>

  <script src="cordova.js"></script>
  <script src="grammar-data.js"></script>
  <script>
    (() => {
      const phrases = window.EASY_ENGLISH_PHRASES || [];
      let index = 0, correct = 0, answered = false;
      const $ = id => document.getElementById(id);

      function shuffle(items){
        const a=[...items];
        for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
        return a;
      }

      function makeOptions(item){
        const sameLevel=phrases.filter(p=>p.level===item.level && p.id!==item.id);
        const wrong=shuffle(sameLevel).slice(0,3).map(p=>p.spanish);
        return shuffle([item.spanish,...wrong]);
      }

      function showQuestion(){
        answered=false;
        const item=phrases[index%phrases.length];
        $('meta').textContent=item.level+' · '+item.topic;
        $('sentence').textContent=item.english;
        $('feedback').textContent='';
        $('nextBtn').classList.remove('show');
        $('answers').innerHTML='';
        makeOptions(item).forEach(option=>{
          const b=document.createElement('button');
          b.className='answer';
          b.textContent=option;
          b.onclick=()=>answer(b,option,item.spanish);
          $('answers').appendChild(b);
        });
        $('progressBar').style.width=((index%20)+1)*5+'%';
      }

      function answer(button,value,right){
        if(answered) return;
        answered=true;
        document.querySelectorAll('.answer').forEach(b=>{
          b.disabled=true;
          if(b.textContent===right) b.classList.add('correct');
        });
        if(value===right){
          correct++;
          $('feedback').textContent='✓ Correct';
        }else{
          button.classList.add('wrong');
          $('feedback').textContent='Not quite';
        }
        $('score').textContent=correct+' correct';
        $('nextBtn').classList.add('show');
      }

      $('nextBtn').onclick=()=>{index++;showQuestion();};
      showQuestion();
    })();
  </script>
</body>
</html>
