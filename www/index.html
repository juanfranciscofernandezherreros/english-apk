<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' data: gap: https://ssl.gstatic.com 'unsafe-eval'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; img-src 'self' data: content:;">
  <meta name="format-detection" content="telephone=no">
  <meta name="msapplication-tap-highlight" content="no">
  <meta name="viewport" content="initial-scale=1,width=device-width,viewport-fit=cover">
  <title>Easy English · Phrases</title>
  <style>
    :root{--bg:#f7f5ef;--card:#fff;--ink:#1f2933;--muted:#667085;--green:#235347;--soft:#dbece6;--gold:#f4b860;--line:#e7e4dc}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    button,input{font:inherit}
    button{cursor:pointer}
    .app{max-width:920px;margin:auto;padding:env(safe-area-inset-top) 14px calc(86px + env(safe-area-inset-bottom))}
    .topbar{position:sticky;top:0;z-index:20;margin:0 -14px;padding:12px 14px;background:rgba(247,245,239,.96);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}
    .brand{display:flex;align-items:center;gap:10px;font-weight:900}.mark{width:36px;height:36px;border-radius:11px;background:var(--green);color:#fff;display:grid;place-items:center;font-size:13px}
    .selected-count{padding:7px 10px;border-radius:999px;background:var(--soft);color:var(--green);font-weight:850;font-size:12px}
    .toolbar{display:grid;gap:10px;padding:18px 0 8px}
    .search{width:100%;border:1px solid var(--line);border-radius:14px;background:#fff;padding:14px 15px;outline:none}.search:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(35,83,71,.1)}
    .chips{display:flex;gap:8px;overflow:auto;padding-bottom:3px;scrollbar-width:none}.chip{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 12px;font-size:12px;font-weight:850;color:var(--muted)}.chip.active{background:var(--green);border-color:var(--green);color:#fff}
    .summary{display:flex;align-items:center;justify-content:space-between;gap:12px;color:var(--muted);font-size:13px;padding:8px 2px 4px}.clear{border:0;background:none;color:var(--green);font-weight:850;padding:4px 0}
    .phrase-list{display:grid;gap:10px;margin-top:8px}
    .phrase{width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:16px;padding:15px 16px;position:relative;color:var(--ink);transition:.15s ease}
    .phrase:active{transform:scale(.995)}
    .phrase.selected{border-color:var(--green);background:var(--soft)}
    .phrase-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
    .meta{font-size:10px;font-weight:900;letter-spacing:.07em;text-transform:uppercase;color:var(--green)}
    .check{width:24px;height:24px;border-radius:8px;border:1px solid #c9c4ba;display:grid;place-items:center;background:#fff;color:transparent;font-size:14px;font-weight:900}
    .selected .check{background:var(--green);border-color:var(--green);color:#fff}
    .english{font-size:17px;font-weight:850;line-height:1.42}
    .spanish{font-size:14px;color:var(--muted);line-height:1.42;margin-top:5px}
    .selected .spanish{color:#47645d}
    .load{width:100%;margin:14px 0 0;border:1px solid var(--line);background:#fff;color:var(--green);border-radius:13px;padding:13px;font-weight:850}
    .empty{text-align:center;padding:44px 16px;color:var(--muted)}
    .bottomnav{position:fixed;z-index:30;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom));width:min(420px,calc(100% - 24px));background:#1f2933;border-radius:18px;display:grid;grid-template-columns:1fr 1fr;padding:7px;box-shadow:0 16px 45px rgba(31,41,51,.25)}
    .navbtn{border:0;background:transparent;color:rgba(255,255,255,.62);padding:11px 8px;border-radius:12px;font-size:12px;font-weight:850}.navbtn.active{background:rgba(255,255,255,.11);color:#fff}
    @media(min-width:700px){.phrase-list{grid-template-columns:1fr 1fr}.app{padding-left:24px;padding-right:24px}}
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand"><span class="mark">EN</span><span>Easy English</span></div>
      <span class="selected-count" id="selectedCount">0 selected</span>
    </header>

    <main>
      <section class="toolbar">
        <input id="searchInput" class="search" type="search" placeholder="Search phrases…" autocomplete="off">
        <div id="levelChips" class="chips"></div>
        <div id="topicChips" class="chips"></div>
        <div class="summary"><span id="resultSummary">10,000 phrases</span><button id="clearSelected" class="clear" hidden>Clear selected</button></div>
      </section>

      <section id="phraseList" class="phrase-list"></section>
      <button id="loadMore" class="load">Show more</button>
    </main>
  </div>

  <nav class="bottomnav" aria-label="Phrase navigation">
    <button class="navbtn active" data-mode="all">All phrases</button>
    <button class="navbtn" data-mode="selected">Selected</button>
  </nav>

  <script src="cordova.js"></script>
  <script src="grammar-data.js"></script>
  <script>
    (() => {
      const phrases = window.EASY_ENGLISH_PHRASES || [];
      const topics = window.EASY_ENGLISH_TOPICS || [];
      const $ = id => document.getElementById(id);
      let selected = new Set(JSON.parse(localStorage.getItem('easyEnglishSelected') || '[]'));
      let level='All', topic='All', query='', visible=50, mode='all';

      function escapeHtml(v){
        return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
      }

      function save(){
        localStorage.setItem('easyEnglishSelected',JSON.stringify([...selected]));
        $('selectedCount').textContent=selected.size.toLocaleString()+' selected';
        $('clearSelected').hidden=selected.size===0;
      }

      function current(){
        const q=query.trim().toLowerCase();
        return phrases.filter(p =>
          (mode==='all' || selected.has(p.id)) &&
          (level==='All' || p.level===level) &&
          (topic==='All' || p.topic===topic) &&
          (!q || p.english.toLowerCase().includes(q) || p.spanish.toLowerCase().includes(q) || p.topic.toLowerCase().includes(q))
        );
      }

      function card(p){
        const b=document.createElement('button');
        b.className='phrase'+(selected.has(p.id)?' selected':'');
        b.innerHTML='<div class="phrase-top"><span class="meta">'+escapeHtml(p.level)+' · '+escapeHtml(p.topic)+'</span><span class="check">✓</span></div>'+
          '<div class="english">'+escapeHtml(p.english)+'</div>'+
          '<div class="spanish">'+escapeHtml(p.spanish)+'</div>';
        b.onclick=()=>{
          if(selected.has(p.id)) selected.delete(p.id); else selected.add(p.id);
          save();
          if(mode==='selected') render(false); else b.classList.toggle('selected',selected.has(p.id));
        };
        return b;
      }

      function render(reset=true){
        if(reset) visible=50;
        const data=current(), list=$('phraseList');
        list.innerHTML='';
        data.slice(0,visible).forEach(p=>list.appendChild(card(p)));
        $('resultSummary').textContent=data.length.toLocaleString()+' phrases';
        $('loadMore').hidden=visible>=data.length || data.length===0;
        if(!data.length) list.innerHTML='<div class="empty">No phrases found.</div>';
      }

      function makeChips(){
        const levels=['All','A1','A2','B1','B2','C1'];
        $('levelChips').innerHTML='';
        levels.forEach(x=>{
          const b=document.createElement('button');
          b.className='chip'+(level===x?' active':'');
          b.textContent=x;
          b.onclick=()=>{level=x;topic='All';makeChips();render();};
          $('levelChips').appendChild(b);
        });

        $('topicChips').innerHTML='';
        ['All',...topics.filter(t=>level==='All'||t.level===level).map(t=>t.name)].forEach(x=>{
          const b=document.createElement('button');
          b.className='chip'+(topic===x?' active':'');
          b.textContent=x;
          b.onclick=()=>{topic=x;makeChips();render();};
          $('topicChips').appendChild(b);
        });
      }

      document.querySelectorAll('.navbtn').forEach(b=>{
        b.onclick=()=>{
          mode=b.dataset.mode;
          document.querySelectorAll('.navbtn').forEach(x=>x.classList.toggle('active',x===b));
          render();
          window.scrollTo({top:0,behavior:'smooth'});
        };
      });

      $('searchInput').addEventListener('input',e=>{query=e.target.value;render();});
      $('loadMore').onclick=()=>{visible+=50;render(false);};
      $('clearSelected').onclick=()=>{selected.clear();save();render();};

      makeChips();save();render();
    })();
  </script>
</body>
</html>
